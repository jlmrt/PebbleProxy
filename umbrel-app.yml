port: 9432
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Pebble Proxy Community
submission: https://github.com/jlmrt/PebbleProxy
releaseNotes: >-
  Adds typed Index and Pebble app devices with recording-webhook and custom MCP connections,
  including shared or per-gesture webhook routes and exact setup fields. Improves explicit note
  and reminder routing with detailed local Needle diagnostics, fixes Cancel and close controls
  across required-field dialogs, and increases admin interface readability. Reminder entries are
  stored locally and do not send phone notifications.
