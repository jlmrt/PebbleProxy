name: Pebble Proxy
version: "0.1.0-test.10"
tagline: A private voice and AI gateway for Pebble apps
icon: https://raw.githubusercontent.com/jlmrt/PebbleProxy/main/icon.svg
description: >-
  Experimental pre-release. Pebble Proxy gives compatible Pebble apps an authenticated
  gateway for voice uploads, private speech-to-text, OpenAI-compatible assistants, and
  device-scoped notes and reminders. Keep the admin interface private and do not use this
  build for production or irreplaceable data.
