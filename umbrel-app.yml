releaseNotes: >-
  Clarifies the Cloudflare Tunnel direct-container route and the separation between
  Umbrel's host-facing admin port and Pebble Proxy's Docker-only API port. Adds an
  explicit port map and prevents accidental raw host-port publication in package checks.
